name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show files (debug)
        run: ls -R

      - name: Compile
        run: javac Hello.java

      - name: Run
        run: java Hello

